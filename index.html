    <i>(1845-1904)</i>
    <hr>
    <b>Кім:</b>
    ақынб ағартушыб ойшылб аудармашы<br>

    Шыңғыстау, Семей өңірі<br>
    <hr>
    <b>Шығармалар:</b>
    "Қара сөздер","Жаз","Қыс","Ғылым таппай мақтанба"
    <hr>
    <b>Аударрмалары:</b>
    А.Пушкин - "Евгений Онегин"(үзінділер)<br>
